name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci

      - name: Frontend lint
        run: npm --workspace frontend run lint
      - name: Frontend typecheck
        run: npm --workspace frontend run typecheck
      - name: Frontend tests
        run: npm --workspace frontend run test
      - name: Frontend build
        run: npm --workspace frontend run build

      - name: Backend lint
        run: npm --workspace backend run lint
      - name: Backend typecheck
        run: npm --workspace backend run typecheck
      - name: Backend tests
        run: npm --workspace backend run test
      - name: Backend build
        run: npm --workspace backend run build

      - name: Infrastructure lint
        run: npm --workspace infrastructure run lint
      - name: Infrastructure typecheck
        run: npm --workspace infrastructure run typecheck
      - name: Infrastructure synth
        run: npm --workspace infrastructure run synth -- --quiet
